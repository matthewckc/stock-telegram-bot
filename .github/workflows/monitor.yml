name: Stock Signal Telegram Bot

on:
  schedule:
    # UTC 時間：每 30 分鐘執行一次（可根據需求修改 Cron 算式）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 支援在 GitHub 頁面手動點擊觸發

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Signal Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: python stock_signal_monitor.py

      - name: Commit and push signal state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update stock signal state"
